name: Build APK

on:
  push:
    branches: ["main", "trabalho-v2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Se existir atualizacao.zip na raiz da branch, aplica os arquivos,
      # salva o resultado na mesma branch e apaga o zip. Nunca age na main.
      - name: Aplicar atualizacao.zip (se existir)
        run: |
          if [ -f atualizacao.zip ]; then
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "ERRO: não aplico atualizacao.zip direto na main. Envie o zip para a branch trabalho-v2."
              exit 1
            fi
            if unzip -Z1 atualizacao.zip | grep -E '^(/|\.\./|\.github/)'; then
              echo "ERRO: o zip contém caminhos não permitidos (veja acima)."
              exit 1
            fi
            echo "Encontrei atualizacao.zip. Arquivos:"
            unzip -Z1 atualizacao.zip
            unzip -o atualizacao.zip
            rm -f atualizacao.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Aplicar atualizacao.zip"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Atualização aplicada e salva na branch ${GITHUB_REF_NAME}."
          else
            echo "Sem atualizacao.zip: compilando o código como está."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versões usadas
        run: |
          flutter --version
          {
            echo "### Versões usadas nesta compilação"
            echo '```'
            flutter --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --project-name compras_inteligentes \
            --org com.pedrolucas .

          rm -f test/widget_test.dart

          cat > android/app/proguard-rules.pro <<'PRO'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          PRO

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />\n'

          if "android.permission.CAMERA" not in content:
              content = content.replace(
                  "<application",
                  permission + "    <application",
                  1
              )

          manifest.write_text(content)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart code
        run: dart format lib test

      - name: Analyze Dart code
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Localizar mapping.txt do R8
        run: find . -name "mapping.txt" -not -path "./.git/*" | head

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: compras-inteligentes-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: |
            build/app/outputs/mapping/release/mapping.txt
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: compras-inteligentes-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
